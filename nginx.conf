map $http_x_forwarded_proto $forwarded_scheme {
  default $scheme;
  https https;
}
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 128k;
  resolver 127.0.0.11 valid=30s ipv6=off;
  set $control_upstream "${CONTROL_UPSTREAM}";
  proxy_ssl_server_name on;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy same-origin always;
  location = /health { access_log off; default_type application/json; return 200 '{"status":"ok"}'; }
  location /api/control/ {
    proxy_pass $control_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_scheme;
    proxy_read_timeout 15s;
  }
  location / { try_files $uri $uri/ /index.html; add_header Cache-Control "no-cache"; }
}
